<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HexaGlaze">
  <!-- Blue gradient background capsule -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#0F7ABC"/>
      <stop offset="100%" stop-color="#0C5FA3"/>
    </linearGradient>
    <linearGradient id="top" x1="20" y1="16" x2="38" y2="10">
      <stop offset="0%" stop-color="#7FD5FF"/>
      <stop offset="100%" stop-color="#39B8FF"/>
    </linearGradient>
    <linearGradient id="right" x1="36" y1="26" x2="50" y2="34">
      <stop offset="0%" stop-color="#28B0F0"/>
      <stop offset="100%" stop-color="#0A8FD6"/>
    </linearGradient>
    <linearGradient id="left" x1="14" y1="30" x2="32" y2="36">
      <stop offset="0%" stop-color="#1A9DE0"/>
      <stop offset="100%" stop-color="#0E7FC4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#39B8FF" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Isometric 3D cube (top face, right face, left face) -->
  <g filter="url(#glow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left face -->
    <path d="M20 36 32 42 32 50 20 44 Z" fill="url(#left)" stroke="#7FD5FF" stroke-opacity="0.25" stroke-width="0.5"/>
    <!-- Right face -->
    <path d="M32 42 44 36 44 44 32 50 Z" fill="url(#right)" stroke="#0F7ABC" stroke-opacity="0.25" stroke-width="0.5"/>
    <!-- Top face -->
    <path d="M20 36 32 30 44 36 32 42 Z" fill="url(#top)" stroke="#B7EBFF" stroke-opacity="0.9" stroke-width="1.5"/>
    <!-- Subtle top ridge -->
    <path d="M24 34 32 30 40 34" fill="none" stroke="#DDF6FF" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>
</svg>
